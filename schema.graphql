type ActivityEvent {
  action: String!
  createdAt: DateTime!
  detail: String
  id: Int!
  releaseId: Int!
}

input CreateReleaseInput {
  additionalInfo: String
  date: DateTime!
  name: String!
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.This scalar is serialized to a string in ISO 8601 format and parsed from a string in ISO 8601 format.
"""
scalar DateTime

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

type Mutation {
  createRelease(input: CreateReleaseInput!): Release!
  deleteRelease(id: Int!): Boolean!
  updateRelease(input: UpdateReleaseInput!): Release!
}

type OngoingRelease {
  completedCount: Int!
  id: Int!
  name: String!
  status: ReleaseStatus!
  totalSteps: Int!
}

type Query {
  activityLog(releaseId: Int!): [ActivityEvent!]!
  ongoingRelease: OngoingRelease
  release(id: Int!): Release
  releases: [Release!]!
  suggestVersion: VersionSuggestion
}

type Release {
  additionalInfo: String
  completedSteps: [String!]!
  createdAt: DateTime!
  date: DateTime!
  id: Int!
  name: String!
  status: ReleaseStatus!
  stepCompletedAt: JSON!
  updatedAt: DateTime!
}

enum ReleaseStatus {
  done
  ongoing
  planned
}

input UpdateReleaseInput {
  additionalInfo: String
  completedSteps: [String!]!
  date: DateTime!
  id: Int!
  name: String!
}

type VersionSuggestion {
  major: String!
  minor: String!
  patch: String!
  prefix: String!
}
